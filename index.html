<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicolò Brugnola - Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 20px;
        }
        h1 {
            margin: 10px 0 5px;
            color: #222;
        }
        .bio {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .projects {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-project {
            display: block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-project:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .btn-project span {
            display: block;
            font-size: 13px;
            font-weight: normal;
            margin-top: 4px;
            opacity: 0.9;
        }
        .footer {
            margin-top: 35px;
            font-size: 14px;
        }
        .footer a {
            color: #007bff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto Profilo -->
        <img src="https://raw.githubusercontent.com/nicolobrugnola/nicobru/main/images.jpeg" alt="Foto Profilo" class="profile-img">
        
        <!-- Nome e Bio -->
        <h1>Nicolò Brugnola</h1>
        <p class="bio">pagina di presentazione!</p>

        <!-- Sezione Pulsanti Lavori -->
        <h2>I Miei Lavori</h2>
        <div class="projects">
            <!-- Tasto Anagrafica -->
            <a href="anagrafica0001.html" target="_blank" class="btn-project">
                📁 Anagrafica
                <span>Apri l'applicazione Anagrafica</span>
            </a>

            <!-- Tasto Calcolatrice -->
            <a href="calcol.html" target="_blank" class="btn-project">
                🧮 Calcolatrice
                <span>Apri la Calcolatrice</span>
            </a>
        </div>

        <!-- Footer / Link GitHub -->
        <div class="footer">
            <p>Visita il mio <a href="https://github.com/nicolobrugnola" target="_blank">Profilo GitHub</a></p>
        </div>
    </div>

</body>
</html>
