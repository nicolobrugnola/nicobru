<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicolò Brugnola - Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 20px;
        }
        h1 {
            margin: 10px 0 5px;
            color: #222;
        }
        .bio {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .projects {
            text-align: left;
            margin-top: 20px;
        }
        .project-card {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }
        .project-card h3 {
            margin: 0 0 5px 0;
            color: #007bff;
        }
        .project-card p {
            margin: 0;
            color: #555;
            font-size: 14px;
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
        }
        .footer a {
            color: #007bff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto Profilo -->
        <img src="https://raw.githubusercontent.com/nicolobrugnola/nicobru/main/images.jpeg" alt="Foto Profilo" class="profile-img">
        
        <!-- Nome e Bio -->
        <h1>Nicolò Brugnola</h1>
        <p class="bio">pagina di presentazione!</p>

        <!-- Sezione Lavori -->
        <div class="projects">
            <h2>I Miei Lavori</h2>
            
            <div class="project-card">
                <h3>Anagrafica</h3>
                <p>Un'applicazione o script per la gestione e l'organizzazione dei dati anagrafici.</p>
            </div>

            <div class="project-card">
                <h3>Calcolatrice</h3>
                <p>Calcoli e operazioni matematiche.</p>
            </div>
        </div>

        <!-- Footer / Link GitHub -->
        <div class="footer">
            <p>Visita il mio <a href="https://github.com/nicolobrugnola" target="_blank">Profilo GitHub</a></p>
        </div>
    </div>

</body>
</html>
